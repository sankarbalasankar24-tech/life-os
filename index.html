<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0d0f18"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Life OS</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* Core palette — warm black + electric orange */
  --bg:#0a0a0b;
  --bg2:#111114;
  --bg3:#18181d;
  --card:#1c1c22;
  --card2:#222229;
  --card3:#28282f;
  --border:rgba(255,255,255,0.06);
  --border2:rgba(255,255,255,0.11);
  --text:#f0ede8;
  --muted:#888792;
  --faint:#3a3a45;

  /* Brand colors */
  --orange:#ff6b2b;
  --orange2:#ff8c55;
  --orange3:rgba(255,107,43,0.15);
  --amber:#f5c842;
  --amber2:rgba(245,200,66,0.15);
  --green:#22d48f;
  --green2:rgba(34,212,143,0.12);
  --red:#ff4d6a;
  --red2:rgba(255,77,106,0.12);
  --blue:#4d9fff;
  --blue2:rgba(77,159,255,0.12);
  --purple:#a855f7;
  --purple2:rgba(168,85,247,0.12);
  --teal:#00d4c8;
  --teal2:rgba(0,212,200,0.12);
  --pink:#ff6eb4;
  --pink2:rgba(255,110,180,0.12);

  /* Legacy compat */
  --accent:#ff6b2b;
  --accent2:#e85a1e;

  --font:'Sora',sans-serif;
  --serif:'Sora',sans-serif;
  --nav:68px;
  --r:16px;
  --rs:11px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--font);color:var(--text);background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:11px 14px;font-size:14px;width:100%;outline:none;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--orange)}
select option{background:var(--bg2)}
textarea{resize:none;line-height:1.6}
::-webkit-scrollbar{width:0;height:0}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top)}
#screens{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav) + var(--safe-bot) + 20px);display:none}
.screen.active{display:block;animation:screenIn .22s cubic-bezier(.4,0,.2,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── NAV — pill style ── */
#nav{
  height:calc(var(--nav) + var(--safe-bot));
  padding-bottom:var(--safe-bot);
  display:flex;
  align-items:center;
  background:rgba(10,10,11,.95);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border-top:1px solid var(--border);
  z-index:100;
  flex-shrink:0;
  padding:0 6px;
  padding-bottom:var(--safe-bot);
  gap:2px;
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:6px 2px;border-radius:12px;
  color:var(--faint);font-size:8.5px;letter-spacing:.2px;font-weight:600;
  text-transform:uppercase;transition:all .18s;position:relative;
}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:all .18s}
.nav-btn.active{color:var(--orange);background:rgba(255,107,43,0.1);border:1px solid rgba(255,107,43,0.18)}
.nav-btn.active svg{stroke:var(--orange);transform:scale(1.12)}
/* Per-tab active colors */
#nav-tasks.active{color:var(--green);background:var(--green2);border-color:rgba(34,212,143,.2)}
#nav-tasks.active svg{stroke:var(--green)}
#nav-goals.active{color:var(--amber);background:var(--amber2);border-color:rgba(245,200,66,.2)}
#nav-goals.active svg{stroke:var(--amber)}
#nav-finance.active{color:var(--teal);background:var(--teal2);border-color:rgba(0,212,200,.2)}
#nav-finance.active svg{stroke:var(--teal)}
#nav-calendar.active{color:var(--pink);background:var(--pink2);border-color:rgba(255,110,180,.2)}
#nav-calendar.active svg{stroke:var(--pink)}
#nav-journal.active{color:var(--purple);background:var(--purple2);border-color:rgba(168,85,247,.2)}
#nav-journal.active svg{stroke:var(--purple)}
#nav-more.active{color:var(--blue);background:var(--blue2);border-color:rgba(77,159,255,.2)}
#nav-more.active svg{stroke:var(--blue)}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:18px;margin:0 14px 10px}
.card-sm{background:var(--card);border-radius:var(--rs);border:1px solid var(--border);padding:13px 15px}
.glass-card{background:rgba(28,28,34,.7);backdrop-filter:blur(20px);border-radius:var(--r);border:1px solid var(--border2)}

/* ── STAT CARDS ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px 10px}
.stat-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:15px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:-20px;right:-20px;width:70px;height:70px;border-radius:50%;opacity:.08}
.stat-card.sc-orange::before{background:var(--orange)}
.stat-card.sc-green::before{background:var(--green)}
.stat-card.sc-blue::before{background:var(--blue)}
.stat-card.sc-purple::before{background:var(--purple)}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:600;margin-bottom:4px}
.stat-val{font-size:24px;font-weight:700;line-height:1;letter-spacing:-.5px}
.stat-trend{font-size:10px;margin-top:4px;font-weight:600;display:flex;align-items:center;gap:3px}
.trend-up{color:var(--green)} .trend-dn{color:var(--red)}

/* ── PAGE HEADER ── */
.page-header{padding:16px 18px 8px;position:sticky;top:0;z-index:10;background:linear-gradient(to bottom,var(--bg) 85%,transparent)}
.page-header h1{font-size:26px;font-weight:700;letter-spacing:-.5px}
.page-header .sub{color:var(--muted);font-size:12px;margin-top:1px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* ── SECTION TITLE ── */
.sec-title{padding:14px 18px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.sec-title::before{content:'';width:3px;height:12px;border-radius:2px;background:var(--orange)}

/* ── TABS ── */
.tabs{display:flex;gap:6px;padding:4px 14px 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--muted);white-space:nowrap;transition:all .15s}
.tab.active{background:rgba(255,107,43,.15);color:var(--orange);border-color:rgba(255,107,43,.3)}

/* ── TASKS ── */
.task-list{display:flex;flex-direction:column;gap:7px;padding:0 14px}
.task-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;padding:12px 14px 6px;display:flex;align-items:center;gap:7px;color:var(--muted)}
.task-item{background:var(--card);border-radius:14px;border:1px solid var(--border);display:flex;align-items:flex-start;gap:11px;padding:13px 14px;transition:all .15s;animation:slideIn .18s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.task-item:active{transform:scale(.99)}
.task-item.done{opacity:.28}
.task-item.done .task-title{text-decoration:line-through}
.task-item.ov1{border-left:3px solid var(--amber)}
.task-item.ov3{border-left:3px solid var(--orange)}
.task-item.ov7{border-left:3px solid var(--red);background:rgba(255,77,106,.04)}
.ob{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.ob1{background:var(--amber2);color:var(--amber)}.ob3{background:var(--orange3);color:var(--orange)}.ob7{background:var(--red2);color:var(--red)}
.check-btn{width:24px;height:24px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .18s;cursor:pointer;margin-top:1px}
.check-btn.chk{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(34,212,143,.35)}
.check-btn svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .12s}
.check-btn.chk svg{opacity:1}
.task-body{flex:1;min-width:0}
.task-title{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prio-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px}
.p1{background:var(--red);box-shadow:0 0 6px var(--red)}.p2{background:var(--orange);box-shadow:0 0 6px var(--orange)}.p3{background:var(--amber)}.p4{background:var(--blue)}.p5{background:var(--faint)}

/* ── PROGRESS ── */
.prog-bar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:8px}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--orange),var(--amber));transition:width .6s cubic-bezier(.4,0,.2,1)}
.prog-ring-track{fill:none;stroke:var(--bg3);stroke-width:5}
.prog-ring-fill{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s ease}

/* ── GOALS ── */
.goal-card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:18px;margin:0 14px 10px;animation:slideIn .18s ease}

/* ── FINANCE ── */
.fin-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.fin-row:last-child{border-bottom:none}
.fin-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.fin-body{flex:1;min-width:0}
.fin-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fin-sub{font-size:11px;color:var(--muted);margin-top:1px}
.fin-amt{font-size:15px;font-weight:700;white-space:nowrap}
.inc{color:var(--green)}.exp{color:var(--red)}

/* ── STOCK CARD ── */
.stock-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:16px;margin-bottom:10px;position:relative;overflow:hidden}
.stock-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stock-card.profit::after{background:linear-gradient(90deg,var(--green),transparent)}
.stock-card.loss::after{background:linear-gradient(90deg,var(--red),transparent)}
.stock-ticker{font-size:18px;font-weight:800;letter-spacing:-.3px}
.stock-pl{font-size:22px;font-weight:800;letter-spacing:-.5px}

/* ── P&L CARDS ── */
.pl-row{display:flex;gap:8px;padding:0 14px;margin-bottom:12px}
.pl-card{border-radius:14px;border:1px solid var(--border);padding:14px;flex:1;text-align:center;position:relative;overflow:hidden}
.pl-profit{background:linear-gradient(135deg,rgba(34,212,143,.08),rgba(34,212,143,.03));border-color:rgba(34,212,143,.2)}
.pl-loss{background:linear-gradient(135deg,rgba(255,77,106,.08),rgba(255,77,106,.03));border-color:rgba(255,77,106,.2)}
.pl-neutral{background:var(--card);border-color:var(--border)}
.pl-label{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:5px;font-weight:700}
.pl-val{font-size:18px;font-weight:800;letter-spacing:-.3px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.2px}
.bg{background:var(--green2);color:var(--green);border:1px solid rgba(34,212,143,.2)}
.ba{background:var(--amber2);color:var(--amber);border:1px solid rgba(245,200,66,.2)}
.bl{background:var(--blue2);color:var(--blue);border:1px solid rgba(77,159,255,.2)}
.bt{background:var(--teal2);color:var(--teal);border:1px solid rgba(0,212,200,.2)}
.bo{background:var(--orange3);color:var(--orange);border:1px solid rgba(255,107,43,.2)}

/* ── OVERDUE STRIP ── */
.ov-strip{margin:0 14px 12px;background:linear-gradient(135deg,rgba(255,77,106,.1),rgba(255,77,106,.05));border:1px solid rgba(255,77,106,.2);border-radius:14px;padding:12px 15px}

/* ── CALENDAR ── */
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:13px;cursor:pointer;position:relative;transition:all .15s;font-weight:500}
.cal-cell:active{transform:scale(.93)}
.cal-cell.today{background:var(--orange);color:#fff;font-weight:800;box-shadow:0 4px 14px rgba(255,107,43,.4)}
.cal-cell.has-event::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--amber);position:absolute;bottom:2px}
.cal-cell.today.has-event::after{background:#fff}
.cal-cell.other-month{color:var(--faint)}
.cal-day-header{font-size:9px;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:700;padding:8px 0;letter-spacing:.4px}
.event-item{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.event-color{width:4px;height:36px;border-radius:2px;flex-shrink:0}
.event-body{flex:1;min-width:0}
.event-title{font-size:13px;font-weight:600}
.event-time{font-size:11px;color:var(--muted);margin-top:2px}

/* ── JOURNAL ── */
.journal-entry{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:16px;margin-bottom:10px}
.journal-time{font-size:11px;color:var(--muted);margin-bottom:6px}
.journal-text{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}

/* ── ACCOUNTS ── */
.acc-card{background:linear-gradient(135deg,var(--card),var(--card2));border-radius:14px;border:1px solid var(--border);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}

/* ── SETTINGS ── */
.settings-section{background:var(--card);border-radius:var(--r);border:1px solid var(--border);margin:0 14px 10px;overflow:hidden}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.settings-row:last-child{border-bottom:none}
.settings-row:active{background:var(--card2)}
.settings-label{font-size:14px;font-weight:500}
.settings-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* ── HERO BANNER ── */
.hero-banner{margin:0 14px 14px;border-radius:20px;padding:20px;position:relative;overflow:hidden}
.hero-banner::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;opacity:.15;background:radial-gradient(circle,var(--orange),transparent)}
.hero-banner::after{content:'';position:absolute;bottom:-30px;left:30px;width:100px;height:100px;border-radius:50%;opacity:.08;background:radial-gradient(circle,var(--amber),transparent)}

/* ── METRIC ROW ── */
.metric-row{display:flex;gap:8px;padding:0 14px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.metric-row::-webkit-scrollbar{display:none}
.metric-chip{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;flex-shrink:0;min-width:100px;text-align:center}
.metric-chip-val{font-size:18px;font-weight:800;letter-spacing:-.3px;margin-bottom:2px}
.metric-chip-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}

/* ── WORD OF DAY ── */
.wod-card-today{margin:0 14px 12px;background:linear-gradient(135deg,rgba(168,85,247,.12),rgba(77,159,255,.07));border:1px solid rgba(168,85,247,.2);border-radius:18px;padding:16px}
.wod-word{font-size:24px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#a855f7,#4d9fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.wod-pos{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin:3px 0 6px}
.wod-def{font-size:13px;line-height:1.65;color:var(--text)}
.wod-ex{font-size:12px;color:var(--muted);font-style:italic;border-left:2px solid var(--purple);padding-left:10px;margin-top:8px}

/* ── MEMORY CARD ── */
.mem-card{background:var(--card);border-radius:12px;border:1px solid rgba(168,85,247,.18);padding:13px 15px;margin-bottom:8px}
.mem-when{font-size:9px;color:var(--purple);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}

/* ── FAB ── */
#fab{position:fixed;bottom:calc(var(--nav) + var(--safe-bot) + 16px);right:16px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--amber));display:flex;align-items:center;justify-content:center;z-index:200;box-shadow:0 6px 24px rgba(255,107,43,.45);transition:all .15s}
#fab:active{transform:scale(.9)}
#fab svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ── SEARCH ── */
.search-bar{display:flex;align-items:center;gap:10px;margin:0 14px 12px;background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:11px 14px}
.search-bar svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}
.search-bar input{background:none;border:none;outline:none;font-size:14px;flex:1;padding:0;color:var(--text)}

/* ── BOTTOM SHEET ── */
#sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px)}
#sheet-overlay.open{opacity:1;pointer-events:auto}
#bottom-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-radius:22px 22px 0 0;z-index:400;padding:10px 18px 18px;padding-bottom:calc(18px + var(--safe-bot));max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);border-top:1px solid var(--border2)}
#bottom-sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--faint);border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:16px;letter-spacing:-.2px}
.form-row{margin-bottom:13px}
.form-row label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.btn-primary{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--orange),var(--amber));color:#fff;font-size:15px;font-weight:700;text-align:center;transition:all .15s;margin-top:4px;letter-spacing:.1px}
.btn-primary:active{transform:scale(.98);opacity:.9}
.btn-ghost{width:100%;padding:13px;border-radius:12px;background:var(--bg3);color:var(--text);font-size:14px;font-weight:500;text-align:center;border:1px solid var(--border2);margin-top:8px;transition:background .15s}
.btn-ghost:active{background:var(--card2)}
.btn-seg{flex:1;padding:9px;border-radius:9px;background:var(--bg3);color:var(--muted);font-size:13px;font-weight:600;text-align:center;transition:all .14s;border:1px solid var(--border)}
.btn-seg.active{background:rgba(255,107,43,.15);color:var(--orange);border-color:rgba(255,107,43,.3)}
.seg-row{display:flex;gap:8px;margin-bottom:13px}
.date-chip{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;background:var(--bg3);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .13s;display:inline-block;margin:0 4px 6px 0}
.date-chip.sel{background:rgba(255,107,43,.15);color:var(--orange);border-color:rgba(255,107,43,.3)}

/* ── MICRO BUTTONS ── */
.mbtn{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;cursor:pointer;border:1px solid;display:inline-block;margin-top:5px;margin-right:4px;transition:opacity .12s;background:none}
.mbtn:active{opacity:.7}
.mbtn-p{color:var(--purple);border-color:rgba(168,85,247,.3);background:rgba(168,85,247,.08)}
.mbtn-t{color:var(--teal);border-color:rgba(0,212,200,.3);background:rgba(0,212,200,.08)}
.mbtn-o{color:var(--orange);border-color:rgba(255,107,43,.3);background:rgba(255,107,43,.08)}

/* ── TOAST ── */
#toast{position:fixed;top:calc(var(--safe-top)+14px);left:50%;transform:translateX(-50%) translateY(-80px);background:var(--card2);border:1px solid var(--border2);border-radius:12px;padding:10px 18px;font-size:13px;font-weight:600;z-index:999;transition:transform .28s cubic-bezier(.32,.72,0,1);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s ease}
#splash.hidden{opacity:0;pointer-events:none}
.splash-logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--orange),var(--amber));display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:20px;box-shadow:0 8px 32px rgba(255,107,43,.4);animation:splashPulse 1.5s ease infinite}
@keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.splash-title{font-size:30px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--orange),var(--amber));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.splash-sub{font-size:13px;color:var(--muted);margin-top:6px}

/* ── SPINNERS & SKELETONS ── */
.spinner{width:24px;height:24px;border:2.5px solid var(--border2);border-top-color:var(--orange);border-radius:50%;animation:spin .65s linear infinite;margin:28px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:12px;opacity:.6}
.empty-text{font-size:13px;line-height:1.7}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skel{background:linear-gradient(90deg,var(--bg3) 25%,var(--card2) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:7px}
.skel-line{height:13px;margin-bottom:9px}.skel-line.wide{width:80%}.skel-line.med{width:55%}.skel-line.short{width:35%}
.skel-card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:18px;margin:0 14px 10px}
.skel-circle{border-radius:50%}

/* ── TSEC ── */
.tsec{padding:12px 14px 5px;font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:800;display:flex;align-items:center;gap:7px}

/* ── MINI CHART BARS (SVG inline) ── */
.mini-chart{display:flex;align-items:flex-end;gap:3px;height:36px}
.mini-bar{border-radius:3px 3px 0 0;transition:height .4s ease;min-width:6px}

/* ── CHART CONTAINER ── */
.chart-container{padding:0 14px;margin-bottom:12px}
.chart-box{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:16px;overflow:hidden}
.chart-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}

/* ── PIE LEGEND ── */
.pie-legend{display:flex;flex-direction:column;gap:6px;flex:1;overflow:hidden}
.pie-legend-item{display:flex;align-items:center;gap:8px;font-size:11px}
.pie-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* scrollbar */
::-webkit-scrollbar{display:none}

/* ══════════════════════════════════════════════
   LIFE OS UI v3 — Rich visual upgrade
   Orange-black theme with infographics
══════════════════════════════════════════════ */

/* ── HERO BANNER (Today) ── */
.hero-banner{
  margin:12px 14px;
  background:linear-gradient(135deg,#1a0e05 0%,#2d1506 40%,#1a0b0b 100%);

  padding:20px;

}

  content:'';position:absolute;top:-40px;right:-30px;

}
.hero-banner::after{
  content:'';position:absolute;bottom:-30px;left:-20px;
  width:100px;height:100px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,200,66,.1) 0%,transparent 70%);
  pointer-events:none;
}
.hero-greeting{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.2;margin-top:4px}
.hero-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:5px}

/* ── KPI ROW — horizontal scroll ── */
.kpi-scroll{display:flex;gap:10px;padding:0 14px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}

}
.kpi-icon{font-size:20px;margin-bottom:8px}
.kpi-label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.kpi-val{font-size:20px;font-weight:800;letter-spacing:-.5px;line-height:1}
.kpi-trend{font-size:10px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:3px}

/* ── FINANCE OVERVIEW CARD ── */
.fin-hero{

}

}

}
.fin-mini-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:4px}

/* ── CHART CONTAINER ── */
.chart-box{

.donut-track{fill:none;stroke:var(--border2);stroke-width:8}

.txn-row{

.stk-card{

// ══════════════════════════════════════════════════════════════
// SUPABASE CLIENT — replaces Apps Script backend
// ══════════════════════════════════════════════════════════════
var SB = null; // Supabase client instance

function initSupabase() {
  if (!CFG.sbUrl || !CFG.sbKey) return false;
  try {
    SB = window.supabase.createClient(CFG.sbUrl, CFG.sbKey, {
      auth: { persistSession: true, autoRefreshToken: true },
      realtime: { params: { eventsPerSecond: 2 } }
    });
    return true;
  } catch(e) { console.error('Supabase init failed:', e); return false; }
}

// ── LOCAL CACHE (IndexedDB via localStorage for simplicity) ────
var MEM = {}; // in-memory cache — survives tab switches

function memGet(key) { return MEM[key] || null; }
function memSet(key, data, ttlSec) {
  MEM[key] = { data: data, exp: Date.now() + (ttlSec||120)*1000 };
  try { localStorage.setItem('sb_'+key, JSON.stringify(MEM[key])); } catch(e) {}
}
function memDel(keys) {
  (keys||[]).forEach(function(k) {
    delete MEM[k];
    try { localStorage.removeItem('sb_'+k); } catch(e) {}
  });
}
function memLoad() {
  // Load localStorage cache into memory on boot
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.startsWith('sb_')) {
        var entry = JSON.parse(localStorage.getItem(k));
        if (entry && entry.exp > Date.now()) MEM[k.slice(3)] = entry;
      }
    }
  } catch(e) {}
}

// ── SUPABASE QUERY HELPERS ─────────────────────────────────────
async function sbGet(table, opts) {
  if (!SB) return null;
  opts = opts || {};
  var q = SB.from(table).select(opts.select || '*');
  if (opts.eq) Object.keys(opts.eq).forEach(function(k){ q = q.eq(k, opts.eq[k]); });
  if (opts.neq) Object.keys(opts.neq).forEach(function(k){ q = q.neq(k, opts.neq[k]); });
  if (opts.gte) Object.keys(opts.gte).forEach(function(k){ q = q.gte(k, opts.gte[k]); });
  if (opts.lte) Object.keys(opts.lte).forEach(function(k){ q = q.lte(k, opts.lte[k]); });
  if (opts.ilike) Object.keys(opts.ilike).forEach(function(k){ q = q.ilike(k, opts.ilike[k]); });
  if (opts.order) q = q.order(opts.order, { ascending: opts.asc !== false });
  if (opts.limit) q = q.limit(opts.limit);
  var result = await q;
  if (result.error) { console.error('sbGet error', table, result.error); return null; }
  return result.data;
}

async function sbInsert(table, row) {
  if (!SB) return null;
  var result = await SB.from(table).insert(row).select().single();
  if (result.error) { console.error('sbInsert error', table, result.error); return null; }
  return result.data;
}

async function sbUpdate(table, id, updates) {
  if (!SB) return null;
  var result = await SB.from(table).update(updates).eq('id', id).select().single();
  if (result.error) { console.error('sbUpdate error', table, result.error); return null; }
  return result.data;
}

async function sbDelete(table, id) {
  if (!SB) return null;
  var result = await SB.from(table).delete().eq('id', id);
  if (result.error) { console.error('sbDelete error', table, result.error); return null; }
  return { ok: true };
}

async function loadFinanceFromDB(period) {
  period = period || 'day';
  var cacheKey = 'finance_' + period;
  var cached = memGet(cacheKey);
  if (cached && cached.exp > Date.now()) { S.finance = cached.data; return cached.data; }
  
  var opts = { order: 'date', asc: false, limit: 300 };
  var now = new Date(), t = isoToday();
  if (period === 'day') opts.eq = { date: t };
  else if (period === 'week') opts.gte = { date: isoAdd(-7) };
  else if (period === 'month') { opts.gte = { date: t.slice(0,7)+'-01' }; }
  else if (period === 'year') { opts.gte = { date: t.slice(0,4)+'-01-01' }; }
  
  var rows = await sbGet('finance', opts);
  if (!rows) return null;
  
  var income = rows.filter(function(r){return r.type==='Income';}).reduce(function(s,r){return s+Number(r.amount);},0);
  var expense = rows.filter(function(r){return r.type==='Expense';}).reduce(function(s,r){return s+Number(r.amount);},0);
  var byCat = {};
  rows.filter(function(r){return r.type==='Expense';}).forEach(function(r){
    byCat[r.category] = (byCat[r.category]||0) + Number(r.amount);
  });
  var result = { rows: rows, income: income, expense: expense, balance: income-expense, byCategory: byCat, period: period };
  S.finance = result;
  memSet(cacheKey, result, 60);
  return result;
}

async function loadStocksFromDB() {
  var rows = await sbGet('stocks', { order: 'buy_date', asc: false });
  if (!rows) return [];
  return rows.map(function(st) {
    var exits = [];
    try { exits = JSON.parse(st.exits_json||'[]'); } catch(e) {}
    var remaining = Number(st.remaining_qty||st.quantity);
    var live = Number(st.live_price)||0;
    var invested = Number(st.buy_price)*remaining + Number(st.charges||0)*(remaining/Number(st.quantity||1));
    var current = live*remaining;
    var runningPL = current - invested;
    var days = st.buy_date ? Math.round((new Date()-new Date(st.buy_date))/(86400000)) : 0;
    return { ID: st.id, Ticker: st.ticker, Exchange: st.exchange, Quantity: st.quantity,
      BuyPrice: st.buy_price, Charges: st.charges, BuyDate: st.buy_date, Term: st.term,
      RemainingQty: remaining, livePrice: live, invested: Math.round(invested),
      runningPL: Math.round(runningPL), runningPLPct: invested ? ((runningPL/invested)*100).toFixed(1) : 0,
      daysSinceBuy: days, exits: exits };
  });
}

  });

async function sellStockInDB(d) {
  var stocks = await sbGet('stocks', { eq: { id: d.id } });
  if (!stocks||!stocks.length) return { ok: false, error: 'Not found' };
  var st = stocks[0];
  var sellQty = Number(d.qty);
  var remaining = Number(st.remaining_qty||st.quantity) - sellQty;
  var buyCostPerUnit = Number(st.buy_price) + Number(st.charges||0)/Number(st.quantity);
  var pl = (Number(d.sellPrice) - buyCostPerUnit) * sellQty - Number(d.charges||0);
  var days = st.buy_date ? Math.round((new Date(d.date||isoToday())-new Date(st.buy_date))/(86400000)) : 0;
  
  // Log trade
  await sbInsert('trade_log', {
    ticker: st.ticker, exchange: st.exchange, buy_qty: st.quantity,
    buy_price: st.buy_price, buy_date: st.buy_date,
    sell_qty: sellQty, sell_price: d.sellPrice, sell_date: d.date||isoToday(),
    buy_charges: st.charges||0, sell_charges: d.charges||0,
    pl: Math.round(pl), days_held: days, term: st.term||'short'
  });
  
  if (remaining <= 0) {
    await sbDelete('stocks', d.id);
  } else {
    var exits = [];
    try { exits = JSON.parse(st.exits_json||'[]'); } catch(e) {}
    exits.push({ Qty: sellQty, SellPrice: d.sellPrice, pl: Math.round(pl), days: days, date: d.date||isoToday() });
    await sbUpdate('stocks', d.id, { remaining_qty: remaining, exits_json: JSON.stringify(exits) });
  }
  // Update account balance
  if (S.accounts && S.accounts.length) {
    var acc = S.accounts.find(function(a){ return a.type==='Trading'; });
    if (acc) await sbUpdate('accounts', acc.id, { balance: Number(acc.balance) + Math.round(pl) });
  }
  memDel(['stocks','accounts']);
  return { ok: true, pl: Math.round(pl), days: days, remaining: Math.max(0,remaining) };
}

  // Filter for today's month-day for "On this day"

  ]);

  return {

  };
}

  };

    TargetDate: g.target_date, Status: g.status||'Active',
    subTasks: (g.subTasks||[]).map(normaliseTask)
  };
}
function normaliseAccount(a) {
  return { ID: a.id, Name: a.name, Type: a.type, Balance: a.balance };
}

// TASK ACTIONS
async function toggleTask(id, ns) {
  var el = document.getElementById('ti-'+id);
  if (el) el.style.opacity = '.4';
  // Optimistic update
  S.tasks = (S.tasks||[]).map(function(t){ if(t.ID===id){t.Status=ns;} return t; });
  renderTasks();
  var r = await updateTaskInDB({ id: id, Status: ns });
  if (r&&r.ok) {
    showToast(ns==='Done'?'Done! &#x2713;':'Reopened');
    if (S.screen==='today') loadToday();
  } else {
    // Rollback
    S.tasks = (S.tasks||[]).map(function(t){ if(t.ID===id){t.Status=(ns==='Done'?'Pending':'Done');} return t; });
    renderTasks();
    showToast('Update failed');
  }
}

async function submitTask(gid) {
  var t = document.getElementById('inp-title') ? document.getElementById('inp-title').value.trim() : '';
  if (!t) { showToast('Enter a title'); return; }
  var dp = document.getElementById('inp-due') ? document.getElementById('inp-due').value : '';
  var rt = document.getElementById('inp-rtime') ? document.getElementById('inp-rtime').value : '';
  var prio = document.getElementById('inp-prio') ? document.getElementById('inp-prio').value : '3';
  var notes = document.getElementById('inp-notes') ? document.getElementById('inp-notes').value : '';
  
  // Optimistic add
  var tempId = 'TEMP_'+Date.now();
  var tempTask = { ID: tempId, Title: t, Priority: Number(prio), DueDate: dp||_due||null,
    Notes: notes, Status: 'Pending', SubType: _subtype||'todo', RemindTime: rt, GoalID: gid||null };
  S.tasks = [tempTask].concat(S.tasks||[]);
  closeSheet(); showToast('Added! &#x2713;'); _due='';
  if (!gid) renderTasks();
  if (S.screen==='today') loadToday();
  
  var r = await addTaskToDB({ title:t, priority:prio, dueDate:dp||_due||'', notes:notes,
    type:gid?'subtask':'simple', goalId:gid||'', subType:_subtype||'todo', remindTime:rt });
  if (r&&r.ok) {
    // Replace temp ID
    S.tasks = (S.tasks||[]).map(function(task){ if(task.ID===tempId){task.ID=r.id;delete task._temp;} return task; });
    if (gid) loadGoals();
  } else {
    S.tasks = (S.tasks||[]).filter(function(task){ return task.ID!==tempId; });
    renderTasks(); showToast('Save failed — check Supabase connection');
  }
}

async function submitEditTask(id) {

  var now = new Date(), hr = now.getHours();
  var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var dateStr = DAYS[now.getDay()]+', '+now.getDate()+' '+MONTHS[now.getMonth()]+' '+now.getFullYear();
  document.getElementById('today-sub').textContent = dateStr;
  
  var isMorning = hr < 15;
  
  var todayData = await getTodayFromDB();
  var stats = await getStatsFromDB();

  }

  el.innerHTML = html;
}

</script>

<script>
// ── CONFIG & STATE ────────────────────────────────────────────
const CFG={
  scriptUrl: localStorage.getItem('scriptUrl')||'',
  sbUrl:     localStorage.getItem('sbUrl')||'',
  sbKey:     localStorage.getItem('sbKey')||'',
  vapidKey:  localStorage.getItem('vapidKey')||'',
  authToken: localStorage.getItem('authToken')||''
};
const S={screen:'today',tasks:[],goals:[],finPeriod:'day',finTab:'overview',
  taskFilter:'pending',categories:{Income:[],Expense:[]},accounts:[],stocks:[],mf:[],finance:null};

const STOCK_LIST=['RELIANCE','TCS','HDFCBANK','INFY','ICICIBANK','HINDUNILVR','SBIN','BAJFINANCE',
  'BHARTIARTL','KOTAKBANK','LT','ASIANPAINT','MARUTI','AXISBANK','SUNPHARMA','TITAN',
  'ULTRACEMCO','NESTLEIND','WIPRO','ONGC','NTPC','POWERGRID','ADANIPORTS','TATAMOTORS',
  'TECHM','HCLTECH','DIVISLAB','DRREDDY','CIPLA','EICHERMOT','GRASIM','JSWSTEEL',
  'TATASTEEL','HINDALCO','COALINDIA','BPCL','IOC','HEROMOTOCO','BAJAJFINSV','BRITANNIA',
  'SHREECEM','HDFCLIFE','SBILIFE','INDUSINDBK','BAJAJ-AUTO','APOLLOHOSP','TATACONSUM',
  'LTIM','ADANIENT','IRCTC','IREDA','IRFC','RVNL','NHPC','SJVN','RECLTD','PFC',
  'ZOMATO','NYKAA','PAYTM','DELHIVERY','VEDL','NMDC','SAIL','HINDZINC','MUTHOOTFIN',
  'CHOLAFIN','MANAPPURAM','CANFINHOME','ADANIGREEN','TATAPOWER','TORNTPOWER',
  'PERSISTENT','MPHASIS','COFORGE','LTTS','KPITTECH','BANKBARODA','PNB','CANARABANK',
  'UNIONBANK','FEDERALBNK','IDFCFIRSTB','AUROPHARMA','ALKEM','TORNTPHARM','LUPIN',
  'BIOCON','GLENMARK','PAGEIND','TRENT','MOTHERSON','BOSCHLTD','BALKRISIND',
  'HAVELLS','VOLTAS','DIXON','DMART','TATAELXSI','MASTEK'];

const PIE_COLORS=['#5b8af0','#2ecc8a','#f5a623','#e8609a','#26c6b8','#9b72f0',
  '#f0605a','#f97316','#38bdf8','#a3e635','#c084fc','#34d399','#fbbf24','#f472b6'];

const CAT_ICONS={Food:'🍛',Transport:'🚗',Shopping:'🛍️',Health:'💊',Bills:'💡',
  Entertainment:'🎬',Education:'📚',Family:'👨‍👩‍👧',Savings:'💰',Fuel:'⛽',Clothing:'👗',
  'Personal care':'🧴',Other:'📦',Salary:'💼',Freelance:'💻','Investment returns':'📈',
  Business:'🏢',Gift:'🎁',Bonus:'💎','Other income':'💵'};

// ── API ───────────────────────────────────────────────────────

// ══ CACHE ENGINE ══════════════════════════════════════════════
var CACHE_TTL = {
  getToday: 60,      // 1 min — tasks/events change often
  getTasks: 120,     // 2 min
  getGoals: 300,     // 5 min
  getFinance: 60,    // 1 min — today's finance
  getJournal: 180,   // 3 min
  getAccounts: 600,  // 10 min
  getStocks: 90,     // 90s — live prices
  getMutualFunds: 300,
  getEvents: 120,
  getStats: 60,
  getMemories: 300
};

function cacheKey(action, params) {
  return 'los_' + action + (params ? '_' + JSON.stringify(params) : '');
}

function cacheGet(action, params) {
  try {
    var key = cacheKey(action, params);
    var raw = localStorage.getItem(key);
    if (!raw) return null;
    var entry = JSON.parse(raw);
    var ttl = (CACHE_TTL[action] || 120) * 1000;
    if (Date.now() - entry.ts > ttl) return null; // expired
    return entry.data;
  } catch(e) { return null; }
}

function cacheSet(action, params, data) {
  try {
    var key = cacheKey(action, params);
    localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data: data }));
  } catch(e) {
    // localStorage full — clear old cache entries
    cacheClear();
  }
}

function cacheInvalidate(actions) {
  // Called after writes to clear relevant caches
  var keys = Object.keys(localStorage);
  keys.forEach(function(k) {
    if (!k.startsWith('los_')) return;
    var matches = !actions || actions.some(function(a) { return k.includes('los_' + a); });
    if (matches) localStorage.removeItem(k);
  });
}

function cacheClear() {
  var keys = Object.keys(localStorage).filter(function(k) { return k.startsWith('los_'); });
  keys.forEach(function(k) { localStorage.removeItem(k); });
}

// Cache-first API: show cached data instantly, refresh in background
async function api(action, params) {
  if (!CFG.scriptUrl) {
    if (action !== 'getStats') showToast('Set Script URL in Settings');
    return null;
  }
  params = params || {};

  // 1. Return cached data immediately
  var cached = cacheGet(action, params);

  // 2. Fetch fresh in background (or foreground if no cache)
  var fetchPromise = (async function() {
    try {
      var url = CFG.scriptUrl + '?action=' + action + '&' + new URLSearchParams(params);
      var r = await fetch(url, { signal: AbortSignal.timeout(12000) });
      var data = await r.json();
      if (data && !data.error) cacheSet(action, params, data);
      return data;
    } catch(e) {
      return null;
    }
  })();

  if (cached !== null) {
    // Return cache immediately, refresh silently
    fetchPromise.then(function(fresh) {
      if (fresh && S.screen) {
        // Silently update state without re-rendering (avoid flicker)
        if (action === 'getTasks' && Array.isArray(fresh)) S.tasks = fresh;
        if (action === 'getGoals' && Array.isArray(fresh)) S.goals = fresh;
        if (action === 'getAccounts' && Array.isArray(fresh)) S.accounts = fresh;
        if (action === 'getStocks' && Array.isArray(fresh)) S.stocks = fresh;
        if (action === 'getMutualFunds' && Array.isArray(fresh)) S.mf = fresh;
      }
    });
    return cached;
  }

  // No cache — await the fetch
  return fetchPromise;
}

async function apiPost(action, data) {
  if (!CFG.scriptUrl) { showToast('Set Script URL in Settings'); return null; }
  data = data || {};

  // Add auth token only if explicitly configured
  if (CFG.authToken && CFG.authToken.length > 0) data._token = CFG.authToken;

  try {
    var r = await fetch(CFG.scriptUrl, {
      method: 'POST',
      body: JSON.stringify({ action: action, data: data }),
      signal: AbortSignal.timeout(15000)
    });
    var result = await r.json();

    // Invalidate relevant caches on writes
    var inv = {
      addTask: ['getToday','getTasks','getStats'],
      updateTask: ['getToday','getTasks','getStats'],
      deleteTask: ['getToday','getTasks','getStats'],
      addFinance: ['getFinance','getStats','getToday'],
      addGoal: ['getGoals'],
      addJournal: ['getJournal'],
      addMemory: ['getMemories','getToday'],
      buyStock: ['getStocks'],
      sellStock: ['getStocks','getStats'],
      addEvent: ['getEvents','getToday'],
      saveAccount: ['getAccounts'],
      updateAccount: ['getAccounts'],
      saveDailyLog: ['getStats']
    };
    if (inv[action]) cacheInvalidate(inv[action]);

    return result;
  } catch(e) {
    showToast('Connection error — check internet');
    return null;
  }
}

// Optimistic UI helper — update local state before server responds
function optimisticAdd(type, item) {
  if (type === 'task') { S.tasks = S.tasks || []; S.tasks.unshift(item); }
}


// ── NAVIGATION ────────────────────────────────────────────────
function goto(s){
  // Show skeleton if no cached content
  var skeletons={tasks:skelTasks,goals:function(){return skelCard(3)+skelCard(2);},finance:skelFinance,journal:function(){return skelCard(2)+skelCard(3);}};
  if(skeletons[s]){var ct=document.getElementById(s+'-content');if(ct&&ct.innerHTML.indexOf('spinner')>-1)ct.innerHTML=skeletons[s]();}
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById('screen-'+s).classList.add('active');
  document.getElementById('nav-'+s).classList.add('active');
  S.screen=s;
  if(s==='today')loadToday();
  if(s==='tasks')loadTasks();
  if(s==='goals')loadGoals();
  if(s==='finance')loadFinance();
  if(s==='journal')loadJournal();
  if(s==='more')renderSettings();
  if(s==='calendar'){S.calYear=S.calYear||new Date().getFullYear();S.calMonth=(S.calMonth!==undefined?S.calMonth:new Date().getMonth());loadCalendar();}
}

// ── OVERDUE ENGINE ────────────────────────────────────────────
function daysOverdue(t){
  if(t.Status==='Done'||!t.DueDate||t.DueDate==='someday')return 0;
  const due=new Date(t.DueDate),now=new Date();
  now.setHours(0,0,0,0);
  const d=Math.floor((now-due)/86400000);
  return d>0?d:0;
}
function effPrio(t){
  const d=daysOverdue(t),p=Number(t.Priority)||3;
  if(d>=7)return 1;
  if(d>=3)return Math.min(p,2);
  if(d>=1)return Math.min(p,3);
  return p;
}

// ── PIE CHART ─────────────────────────────────────────────────
function buildPie(data,r,cx,cy){
  cx=cx||r+4;cy=cy||r+4;
  const tot=data.reduce((s,d)=>s+d.v,0);
  if(!tot)return{svg:'',legend:[],dim:0};
  let ang=-Math.PI/2,svg='';const legend=[];
  data.forEach((d,i)=>{
    const sl=(d.v/tot)*2*Math.PI;
    const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang);
    ang+=sl;
    const x2=cx+r*Math.cos(ang),y2=cy+r*Math.sin(ang);
    const lg=sl>Math.PI?1:0,c=PIE_COLORS[i%PIE_COLORS.length];
    svg+='<path d="M'+cx+','+cy+' L'+x1.toFixed(1)+','+y1.toFixed(1)+
      ' A'+r+','+r+' 0 '+lg+',1 '+x2.toFixed(1)+','+y2.toFixed(1)+' Z"'+
      ' fill="'+c+'" stroke="var(--bg)" stroke-width="1.5"/>';
    legend.push({label:d.k,v:d.v,color:c,pct:Math.round(d.v/tot*100)});
  });
  const hole=Math.round(r*0.52);
  svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+hole+'" fill="var(--card)"/>';
  return{svg,legend,dim:(r+4)*2};
}

function renderPie(elId,data){
  var el=document.getElementById(elId);if(!el)return;
  const tot=data.reduce((s,d)=>s+d.v,0);
  if(!tot){el.innerHTML='<div style="text-align:center;padding:16px;color:var(--muted);font-size:12px">No data for this period</div>';return;}
  const{svg,legend,dim}=buildPie(data,68,72,72);
  const size=144;
  el.innerHTML='<div style="display:flex;gap:14px;align-items:center">'+
    '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="flex-shrink:0">'+svg+'</svg>'+
    '<div style="flex:1">'+
    legend.map(l=>'<div style="display:flex;align-items:center;gap:7px;margin-bottom:6px">'+
      '<div style="width:8px;height:8px;border-radius:50%;background:'+l.color+';flex-shrink:0"></div>'+
      '<div style="flex:1;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(l.label)+'</div>'+
      '<div style="font-size:11px;font-weight:600;white-space:nowrap">&#8377;'+fmt(l.v)+
      ' <span style="color:var(--muted);font-weight:400">'+l.pct+'%</span></div></div>').join('')+
    '<div style="border-top:1px solid var(--border);padding-top:6px;margin-top:2px;font-size:11px;font-weight:600">Total: &#8377;'+fmt(tot)+'</div>'+
    '</div></div>';
}

  var list=S.tasks;
  if(S.taskFilter==='todo')list=list.filter(function(t){return t.Status!=='Done'&&t.SubType!=='buy';});
  else if(S.taskFilter==='buy')list=list.filter(function(t){return t.Status!=='Done'&&t.SubType==='buy';});
  else if(S.taskFilter==='overdue')list=list.filter(function(t){return t.Status!=='Done'&&daysOverdue(t)>0;});
  else if(S.taskFilter==='today')list=list.filter(function(t){return t.Status!=='Done'&&String(t.DueDate).slice(0,10)===ts;});
  else if(S.taskFilter==='week')list=list.filter(function(t){return t.Status!=='Done'&&t.DueDate&&t.DueDate<=ws;});
  else if(S.taskFilter==='done')list=list.filter(function(t){return t.Status==='Done';});
  else list=list.filter(function(t){return t.Status!=='Done';});
  if(q)list=list.filter(function(t){return(t.Title||'').toLowerCase().indexOf(q)!==-1;});
  if(S.taskFilter!=='done')list=list.slice().sort(function(a,b){return effPrio(a)-effPrio(b);});
  var done=S.tasks.filter(function(t){return t.Status==='Done';}).length;
  var total=S.tasks.length,pct=total?Math.round(done/total*100):0;
  var oc=S.tasks.filter(function(t){return t.Status!=='Done'&&daysOverdue(t)>0;}).length;
  var r28=2*Math.PI*28;
  document.getElementById('tasks-progress').innerHTML=total?
    '<div style="display:flex;align-items:center;gap:14px;padding:0 14px;margin-bottom:10px">'+
    '<div style="position:relative;width:64px;height:64px;flex-shrink:0">'+
    '<svg width="64" height="64" viewBox="0 0 68 68">'+
    '<circle cx="34" cy="34" r="28" fill="none" stroke="var(--bg3)" stroke-width="6"/>'+
    '<circle cx="34" cy="34" r="28" fill="none" stroke="var(--green)" stroke-width="6"'+
    ' stroke-dasharray="'+r28.toFixed(1)+'" stroke-dashoffset="'+(r28*(1-pct/100)).toFixed(1)+'"'+
    ' stroke-linecap="round" transform="rotate(-90 34 34)"/></svg>'+
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--green)">'+pct+'%</div>'+
    '</div><div><div style="font-size:13px;font-weight:500">'+done+'/'+total+' done</div>'+
    (oc?'<div style="font-size:11px;color:var(--red);margin-top:2px">'+oc+' overdue</div>':'')+
    '</div></div>':'';
  var thtml='';
  if(S.taskFilter==='all'){
    var todos=list.filter(function(t){return t.SubType!=='buy';});
    var buys=list.filter(function(t){return t.SubType==='buy';});
    if(todos.length){thtml+='<div class="tsec" style="color:var(--accent)">&#x2705; To Do ('+todos.length+')</div><div class="task-list">'+todos.map(function(t){return taskItem(t,false);}).join('')+'</div>';}
    if(buys.length){thtml+='<div class="tsec" style="color:var(--teal)">&#x1F6D2; To Buy ('+buys.length+')</div><div class="task-list">'+buys.map(function(t){return taskItem(t,false);}).join('')+'</div>';}
    if(!todos.length&&!buys.length)thtml='<div class="empty"><div class="empty-icon">&#x2705;</div><div class="empty-text">All done! Tap + to add.</div></div>';
  }else{
    thtml=list.length?'<div class="task-list">'+list.map(function(t){return taskItem(t,false);}).join('')+'</div>':
      '<div class="empty"><div class="empty-icon">&#x1F4CB;</div><div class="empty-text">'+(S.taskFilter==='overdue'?'No overdue tasks!':'Nothing here.')+'</div></div>';
  }
  document.getElementById('tasks-content').innerHTML=thtml;
}
function taskItem(t,compact){
  var done=t.Status==='Done'||t.status==='Done';
  var days=done?0:daysOverdue(t);
  var prio=done?(Number(t.Priority||t.priority)||3):effPrio(t);
  var isBuy=t.SubType==='buy'||t.sub_type==='buy';
  var title=esc(t.Title||t.title||'');
  var due=t.DueDate||t.due_date||'';
  var dueLabel='',dueClass='';
  if(due&&due!=='someday'){
    var dueDateStr=String(due).slice(0,10);
    if(dueDateStr===isoToday()){dueLabel='Today';dueClass='due-today';}
    else if(days>0){dueLabel=days+'d overdue';dueClass='due-overdue';}
    else if(dueDateStr<=isoAdd(3)){dueLabel=formatDate(due);dueClass='due-soon';}
    else{dueLabel=formatDate(due);dueClass='due-future';}
  }else if(due==='someday'){dueLabel='Someday';dueClass='due-future';}
  var rt=t.RemindTime||t.remind_time||'';
  var prioClass=['','p1','p2','p3','p4'][prio]||'p3';
  var taskStyle=isBuy?'buy-style':days>=7?'ov7-style':days>=3?'ov3-style':days>=1?'ov1-style':'';
  var checkClass=done?'done-check':prioClass;
  var tid=esc(String(t.ID||t.id||''));
  var memBtn=!compact?'<button class="mbtn mbtn-p" data-title="'+title+'" data-src="task" onclick="quickMemory(this.dataset.title,this.dataset.src)">&#x1F9E0; Memory</button>':'';
  var editBtn=!compact?'<button class="mbtn mbtn-o" data-id="'+tid+'" data-title="'+title+'" data-prio="'+(t.Priority||t.priority||3)+'" data-due="'+esc(String(due))+'" data-notes="'+esc(t.Notes||t.notes||'')+'" data-st="'+(t.SubType||t.sub_type||'todo')+'" data-rt="'+esc(rt)+'" onclick="openEditTask(this.dataset)">Edit</button>':'';
  var delBtn=!compact?'<button class="mbtn" style="color:var(--red);border-color:rgba(255,77,106,.3);background:rgba(255,77,106,.08)" data-id="'+tid+'" onclick="deleteTask(this.dataset.id)">Del</button>':'';
  return'<div class="task-item-v2 '+(done?'done':'')+' '+taskStyle+'" id="ti-'+tid+'">' +
    '<div class="prio-check '+checkClass+'" data-id="'+tid+'" data-ns="'+(done?'Pending':'Done')+'" onclick="toggleTask(this.dataset.id,this.dataset.ns)">' +
    '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>' +
    '<div style="flex:1;min-width:0">' +
    '<div class="task-title" style="font-size:14px;font-weight:600;line-height:1.3">'+(isBuy?'<span style="margin-right:5px;font-size:12px">&#x1F6D2;</span>':'')+title+'</div>' +
    (!compact&&(dueLabel||rt)?'<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:5px">' +
      (dueLabel?'<span class="due-pill '+dueClass+'">&#x1F4C5; '+dueLabel+'</span>':'')+
      (rt?'<span class="due-pill due-today">&#x1F514; '+rt+'</span>':'')+
      (t.GoalID||t.goal_id?'<span class="due-pill" style="background:var(--blue2);color:var(--blue)">&#x1F3AF; Goal</span>':'')+
      '</div>':'')+
    (!compact?'<div style="margin-top:6px">'+memBtn+editBtn+delBtn+'</div>':'')+
    '</div>' +
    '<div style="font-size:9px;font-weight:800;color:'+(prio===1?'var(--red)':prio===2?'var(--orange)':prio===3?'var(--amber)':'var(--faint)')+';text-transform:uppercase;letter-spacing:.4px;flex-shrink:0;margin-top:2px">'+(prio===1?'URG':prio===2?'HI':prio===3?'':'')+' </div>' +
    '</div>';
}
async function toggleTask(id,ns){
  var el=document.getElementById('ti-'+id);if(el)el.style.opacity='.4';
  const r=await apiPost('updateTask',{id,Status:ns});
  if(r?.ok){const t=S.tasks.find(x=>x.ID===id);if(t)t.Status=ns;
    showToast(ns==='Done'?'✅ Done!':'↩️ Reopened');renderTasks();
    if(S.screen==='today')loadToday();}
}

// ── FINANCE ───────────────────────────────────────────────────
async function loadFinance(){
  const[fd,cats,accs,stocks,mf]=await Promise.all([
    api('getFinance',{period:S.finPeriod}),
    api('getCategories'),api('getAccounts'),api('getStocks'),api('getMutualFunds')
  ]);
  S.finance=fd;S.accounts=accs||[];S.stocks=stocks||[];S.mf=mf||[];
  if(cats)S.categories=cats;
  renderFinTab();
}
function setFinPeriod(p){
  S.finPeriod=p;
  ['day','week','month','year','all'].forEach(x=>document.getElementById('fp-'+x)?.classList.toggle('active',x===p));
  api('getFinance',{period:p}).then(d=>{S.finance=d;renderFinTab();});
}
function finTab(t){
  S.finTab=t;
  const L=['overview','transactions','accounts','stocks','mf'];
  document.querySelectorAll('#fin-tabs .tab').forEach((b,i)=>b.classList.toggle('active',L[i]===t));
  renderFinTab();
}
function renderFinTab(){
  if(S.finTab==='overview')renderFinOverview();
  else if(S.finTab==='transactions')renderFinTrans();
  else if(S.finTab==='accounts')renderFinAccs();
  else if(S.finTab==='stocks')renderFinStocks();
  else if(S.finTab==='mf')renderFinMF();
}

function plCard(label,val){
  const prof=val>=0;
  return'<div class="pl-card '+(prof?'pl-profit':'pl-loss')+'">'+
    '<div class="pl-label">'+label+'</div>'+
    '<div class="pl-val" style="color:'+(prof?'var(--green)':'var(--red)')+'">'+
    (prof?'+':'')+'\u20B9'+fmt(Math.abs(val))+'</div>'+
    '<div style="font-size:10px;margin-top:3px;color:'+(prof?'var(--green)':'var(--red)')+'">'+
    (prof?'\u25B2':'\u25BC')+' '+(prof?'Profit':'Loss')+'</div>'+
    '</div>';
}

function renderFinOverview(){
  var d=S.finance||{};
  var rows=d.rows||[];
  var inc=Number(d.income||0), exp=Number(d.expense||0), bal=inc-exp;
  var nw=(S.accounts||[]).reduce(function(s,a){return s+Number(a.Balance||a.balance||0);},0);
  var shortPL=(S.stocks||[]).filter(function(s){return s.Term==='short';}).reduce(function(s,st){return s+Number(st.runningPL||0);},0);
  var longPL=(S.stocks||[]).filter(function(s){return s.Term==='long';}).reduce(function(s,st){return s+Number(st.runningPL||0);},0);
  var netPL=shortPL+longPL;
  var plProf=netPL>=0;

  var html='';

  // ── Net worth hero ──
  html+='<div class="nw-card">';
  html+='<div style="font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.8px;font-weight:700">Net worth</div>';
  html+='<div style="font-size:34px;font-weight:800;letter-spacing:-1px;color:#fff;margin:5px 0 2px">&#x20B9;'+fmt(nw)+'</div>';
  html+='<div style="display:flex;align-items:center;gap:6px">';
  html+='<span style="font-size:11px;color:var(--blue);font-weight:600">Across '+( S.accounts||[]).length+' accounts</span>';
  html+='</div></div>';

  // ── Income / Expense 2col ──
  var expPct = inc>0 ? Math.min(100,Math.round(exp/inc*100)) : 0;
  html+='<div class="fin-2col">';
  // Income card
  html+='<div class="fin-mini" style="background:linear-gradient(135deg,rgba(34,212,143,.1),var(--card));border-color:rgba(34,212,143,.2)">';
  html+='<div class="fin-mini-label" style="color:var(--green)">Income</div>';
  html+='<div class="fin-mini-val" style="color:var(--green)">&#x20B9;'+fmt(inc)+'</div>';
  html+='<div class="fin-mini-bar"><div class="fin-mini-bar-fill" style="width:100%;background:var(--green);opacity:.5"></div></div>';
  html+='</div>';
  // Expense card
  html+='<div class="fin-mini" style="background:linear-gradient(135deg,rgba(255,77,106,.08),var(--card));border-color:rgba(255,77,106,.2)">';
  html+='<div class="fin-mini-label" style="color:var(--red)">Spent</div>';
  html+='<div class="fin-mini-val" style="color:var(--red)">&#x20B9;'+fmt(exp)+'</div>';
  html+='<div class="fin-mini-bar"><div class="fin-mini-bar-fill" style="width:'+expPct+'%;background:var(--red)"></div></div>';
  html+='</div></div>';

  // ── Balance + Portfolio P&L row ──
  html+='<div style="display:flex;gap:10px;padding:0 14px;margin-bottom:12px">';
  html+='<div style="flex:1;background:var(--card);border-radius:14px;border:1px solid var(--border);padding:14px">';
  html+='<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:3px">Balance</div>';
  html+='<div style="font-size:18px;font-weight:800;color:'+(bal>=0?'var(--green)':'var(--red)')+'">&#x20B9;'+fmt(Math.abs(bal))+'</div>';
  html+='<div style="font-size:10px;color:var(--muted);margin-top:2px">'+(bal>=0?'↑ surplus':'↓ deficit')+'</div>';
  html+='</div>';
  html+='<div style="flex:1;background:'+(plProf?'rgba(34,212,143,.08)':'rgba(255,77,106,.08)')+';border-radius:14px;border:1px solid '+(plProf?'rgba(34,212,143,.2)':'rgba(255,77,106,.2)')+';padding:14px">';
  html+='<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:3px">Portfolio P&amp;L</div>';
  html+='<div style="font-size:18px;font-weight:800;color:'+(plProf?'var(--green)':'var(--red))')+'">'+(plProf?'+':'−')+'&#x20B9;'+fmt(Math.abs(netPL))+'</div>';
  html+='<div style="font-size:10px;color:var(--muted);margin-top:2px">'+( S.stocks||[]).length+' positions</div>';

  // ── Bar chart — spending by day (from rows) ──

    var days={};

    donutData.forEach(function(item,i){
      var pct=Math.round(item.v/donutTotal*100);
      html+='<div style="display:flex;align-items:center;gap:7px;margin-bottom:8px">';
      html+='<div style="width:10px;height:10px;border-radius:3px;background:'+DCOLS[i]+';flex-shrink:0"></div>';

      html+='<div style="font-size:11px;font-weight:700;white-space:nowrap">'+pct+'%</div>';
      html+='</div>';
    });
    html+='</div></div></div>';
  }
  document.getElementById('finance-content').innerHTML=html;
}

function stkList(list){
  if(!list||!list.length)return'<div class="empty-v2"><div class="empty-icon-v2">&#x1F4C8;</div><div class="empty-title">No positions</div><div class="empty-sub">Tap the button below to add your first stock</div></div>';
  return list.map(function(st){
    var remaining=Number(st.RemainingQty||st.Quantity||st.remaining_qty||st.quantity||0);
    var pl=Number(st.runningPL||st.pl||0);
    var plPct=Number(st.runningPLPct||st.plPct||0);
    var prof=pl>=0;
    var live=Number(st.livePrice||st.live_price||0);
    var exits=st.exits||[];
    var days=Number(st.daysSinceBuy||0);
    var exitHtml='';
    if(exits.length){
      exitHtml='<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">';
      exitHtml+='<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px">Exit history</div>';
      exits.forEach(function(ex,i){
        var expl=Number(ex.pl||0),exprof=expl>=0;
        exitHtml+='<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--bg3);border-radius:8px;margin-bottom:4px;font-size:11px">';
        exitHtml+='<span style="color:var(--muted)">Exit '+(i+1)+' &middot; '+ex.Qty+' units @ &#x20B9;'+fmt(Number(ex.SellPrice))+'</span>';
        exitHtml+='<span style="font-weight:700;color:'+(exprof?'var(--green)':'var(--red))')+'">'+(exprof?'+':'−')+'&#x20B9;'+fmt(Math.abs(expl))+'</span>';
        exitHtml+='</div>';
      });
      exitHtml+='</div>';
    }
    return'<div class="stk-card" style="border-left:4px solid '+(prof?'var(--green)':'var(--red)')+'">' +
      '<div class="stk-header">' +
      '<div><div class="stk-ticker">'+esc(st.Ticker||st.ticker)+' <span style="font-size:11px;color:var(--muted);font-weight:400">'+esc(st.Exchange||st.exchange||'NSE')+'</span></div>' +
      '<div class="stk-exchange">'+remaining+' units &middot; '+days+'d held</div></div>' +
      '<div class="stk-pl-badge '+(prof?'stk-pl-up':'stk-pl-dn')+'">' +
      '<span>'+(prof?'▲':'▼')+'</span>'+
      '<span>'+(prof?'+':'−')+'&#x20B9;'+fmt(Math.abs(pl))+'</span>' +
      '<span style="font-size:10px;opacity:.7">('+Math.abs(plPct)+'%)</span>' +
      '</div></div>' +
      '<div class="stk-stats">' +
      '<div class="stk-stat"><div class="stk-stat-label">Buy avg</div><div class="stk-stat-val">&#x20B9;'+fmt(Number(st.BuyPrice||st.buy_price||0))+'</div></div>' +
      '<div class="stk-stat"><div class="stk-stat-label">Live price</div><div class="stk-stat-val" style="color:'+(live>Number(st.BuyPrice||st.buy_price||0)?'var(--green)':'var(--red)')+'">&#x20B9;'+fmt(live)+'</div></div>' +
      '<div class="stk-stat"><div class="stk-stat-label">Invested</div><div class="stk-stat-val">&#x20B9;'+fmt(Number(st.invested||0))+'</div></div>' +
      '</div>' +
      exitHtml+
      '<div style="display:flex;gap:8px;margin-top:12px">' +
      '<button onclick="openSellStock(\''+esc(st.ID||st.id)+'\',\''+esc(st.Ticker||st.ticker)+'\','+remaining+')" style="flex:1;padding:9px;border-radius:10px;background:'+(prof?'var(--green2)':'var(--red2)')+';color:'+(prof?'var(--green)':'var(--red)')+';font-size:12px;font-weight:700;border:1px solid '+(prof?'rgba(34,212,143,.3)':'rgba(255,77,106,.3)')+'">'+
      (exits.length?'Exit more':'Exit position')+'</button>' +
      '<button onclick="deleteStock(\''+esc(st.ID||st.id)+'\',\''+esc(st.Ticker||st.ticker)+'\')" style="width:40px;padding:9px;border-radius:10px;background:var(--card2);color:var(--muted);font-size:12px;border:1px solid var(--border)">✕</button>' +
      '</div></div>';
  }).join('');
}

  el.classList.add('sel');const i=document.getElementById('inp-due');
  if(v==='pick'){i.style.display='block';i.focus();return;}

async function submitTask(gid) {
  var t = document.getElementById('inp-title') ? document.getElementById('inp-title').value.trim() : '';
  if (!t) { showToast('Enter a title'); return; }
  var dp = document.getElementById('inp-due') ? document.getElementById('inp-due').value : '';
  var rt = document.getElementById('inp-rtime') ? document.getElementById('inp-rtime').value : '';
  var prio = document.getElementById('inp-prio') ? document.getElementById('inp-prio').value : '3';
  var notes = document.getElementById('inp-notes') ? document.getElementById('inp-notes').value : '';

  // Optimistic: add to local state immediately
  var tempTask = {
    ID: 'TEMP_' + Date.now(),
    Title: t,
    Priority: prio,
    DueDate: dp || _due || '',
    Notes: notes,
    Status: 'Pending',
    SubType: _subtype || 'todo',
    RemindTime: rt,
    GoalID: gid || '',
    _optimistic: true
  };

  closeSheet();
  showToast('Added! ✓');
  _due = '';

  if (!gid) {
    S.tasks = S.tasks || [];
    S.tasks.unshift(tempTask);
    renderTasks();
    if (S.screen === 'today') loadToday();
  }

  // Send to server in background
  var r = await apiPost('addTask', {
    title: t, priority: prio, dueDate: dp || _due || '',
    notes: notes, type: gid ? 'subtask' : 'simple',
    goalId: gid || '', subType: _subtype || 'todo', remindTime: rt
  });

  // Replace temp with real ID from server
  if (r && r.ok) {
    S.tasks = (S.tasks || []).map(function(task) {
      if (task.ID === tempTask.ID) {
        task.ID = r.id || task.ID;
        delete task._optimistic;
      }
      return task;
    });
    if (gid) { loadGoals(); loadTasks(); }
  } else {
    // Rollback on failure
    S.tasks = (S.tasks || []).filter(function(task) { return task.ID !== tempTask.ID; });
    renderTasks();
    showToast('Failed to save — check connection');
  }
}

function isoToday(){return new Date().toISOString().slice(0,10);}
function isoAdd(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function isoMonthEnd(){const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10);}
function isoYearEnd(){return new Date().getFullYear()+'-12-31';}
function fmtK(n){
  n=Number(n||0);
  if(n>=10000000)return(n/10000000).toFixed(1)+'Cr';
  if(n>=100000)return(n/100000).toFixed(1)+'L';
  if(n>=1000)return(n/1000).toFixed(1)+'K';
  return String(Math.round(n));
}
function fmt(n){return Number(n||0).toLocaleString('en-IN');}
function formatDate(d){
  if(!d||d==='someday')return'Someday';
  try{return new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
  catch(e){return String(d);}
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var WOD_WORDS=['ephemeral','serendipity','melancholy','resilience','perseverance','eloquent','cognizant','pragmatic','diligent','prudent','tenacious','introspect','catalyst','momentum','solitude','equanimity','ameliorate','sanguine','laconic','felicity','sagacious','indefatigable','perspicacity','ebullient','auspicious','benevolent','candid','empathy','fortitude','gratitude'];
async function loadWordOfDay(){
  var today=isoToday();
  if(localStorage.getItem('wod_date')===today){try{return JSON.parse(localStorage.getItem('wod_data'));}catch(e){}}
  try{
    var w=WOD_WORDS[new Date().getDate()%WOD_WORDS.length];
    var resp=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+w);
    var d=await resp.json();
    if(d&&d[0]){
      var entry=d[0],meaning=entry.meanings&&entry.meanings[0],def2=meaning&&meaning.definitions&&meaning.definitions[0];
      var wod={word:entry.word,pos:meaning?meaning.partOfSpeech:'',definition:def2?def2.definition:'',example:def2&&def2.example?def2.example:''};
      localStorage.setItem('wod_date',today);localStorage.setItem('wod_data',JSON.stringify(wod));
      return wod;
    }
  }catch(e){}
  return null;
}
function saveWOD(word,def){
  var dict=JSON.parse(localStorage.getItem('lifeos_dict')||'[]');
  if(!dict.find(function(w){return w.word===word;})){dict.push({word:word,def:def,added:isoToday(),nextReview:isoAdd(3)});localStorage.setItem('lifeos_dict',JSON.stringify(dict));showToast('Saved to dictionary!');}
  else showToast('Already saved');
}

    h+='<div style="background:rgba(155,114,240,.1);border:1px solid rgba(155,114,240,.2);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:var(--purple);font-weight:500">'+due.length+' word'+(due.length>1?'s':'')+' due for review</div>';

function renderCalendar(){

  var DN=['S','M','T','W','T','F','S'];

  var first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),ts=isoToday();
  var evD={};(S.calEvents||[]).forEach(function(e){var d=String(e.Date||'').slice(0,10);if(d)evD[d]=(evD[d]||0)+1;});
  var h='<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 14px 10px"><button onclick="calNav(-1)" style="padding:8px 16px;border-radius:8px;background:var(--card);border:1px solid var(--border);font-size:15px;color:var(--text)">&#8249;</button><b style="font-size:14px">'+MN[m]+' '+y+'</b><button onclick="calNav(1)" style="padding:8px 16px;border-radius:8px;background:var(--card);border:1px solid var(--border);font-size:15px;color:var(--text)">&#8250;</button></div>';

  DN.forEach(function(d){h+='<div class="cal-header-day">'+d+'</div>';});
  for(var i=0;i<first;i++)h+='<div></div>';
  for(var d2=1;d2<=dim;d2++){
    var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d2).padStart(2,'0');
    var isT=ds===ts,hasE=evD[ds]>0;
    h+='<div data-ds="'+ds+'" onclick="calDayClick(this.dataset.ds)" class="cal-day'+(isT?' is-today':'')+(hasE?' has-event':'')+(m2===new Date().getMonth()?'':' other-month')+'">'+ d2+'</div>';
  }
  h+='</div>';
  var mp=y+'-'+String(m+1).padStart(2,'0');
  var mev=(S.calEvents||[]).filter(function(e){return String(e.Date||'').slice(0,7)===mp;}).sort(function(a,b){return String(a.Date).localeCompare(String(b.Date));});

      h+='<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">'+esc(e.Title)+'</div><div style="font-size:11px;color:var(--muted);margin-top:2px">'+formatDate(e.Date)+(e.Time?' at '+e.Time:'')+(e.Notes?' &middot; '+esc(e.Notes):'')+'</div></div>';
      h+='<button class="mbtn mbtn-p" data-t="'+esc(e.Title)+'" data-d="'+String(e.Date).slice(0,10)+'" onclick="openAddReminder(this.dataset.t,this.dataset.d)">+ Remind</button></div>';
    });
    h+='</div>';
  }
  h+='<div style="padding:0 14px;margin-top:8px"><button class="btn-ghost" onclick="openAddEvent()">+ Add event / birthday / anniversary</button></div>';
  document.getElementById('calendar-content').innerHTML=h;

  h+='&bull; morningBrief &rarr; Time-driven &rarr; Day timer &rarr; 6am-7am<br>';

  h+='</div>';
  h+='<div class="form-row"><label>Firebase VAPID Public Key (from step 7)</label>';
  h+='<input type="text" id="inp-vapid" placeholder="BN..." value="'+esc(CFG.vapidKey)+'"/></div>';

}
async function saveAndEnablePush(){
  CFG.vapidKey=document.getElementById('inp-vapid').value.trim();
  localStorage.setItem('vapidKey',CFG.vapidKey);
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){showToast('Push not supported on this browser');return;}
  var p=await Notification.requestPermission();
  if(p!=='granted'){showToast('Permission denied in browser settings');return;}
  try{
    var reg=await navigator.serviceWorker.ready;
    var opts={userVisibleOnly:true};
    if(CFG.vapidKey)opts.applicationServerKey=CFG.vapidKey;
    var sub=await reg.pushManager.subscribe(opts);
    await apiPost('registerToken',{token:JSON.stringify(sub)});
    showToast('Push enabled! Morning 6:30am + night 10pm briefs active.');
  }catch(e){showToast('Setup failed: '+e.message);}
}
async function testPushNow(){
  var r=await apiPost('sendTestPush',{});
  showToast(r&&r.ok?'Test sent!':'Failed - check Firebase key in Apps Script');
}

function openEditTask(d) {

  h += '<div class="form-row"><label>' + (isBuy?'Item':'Task') + '</label><input type="text" id="inp-title" value="'+esc(d.title||'')+'" autocomplete="off"/></div>';
  h += '<div class="form-row"><label>Priority</label><select id="inp-prio">';
  h += '<option value="1"'+(d.prio==='1'?' selected':'')+'>&#x1F534; Urgent</option>';
  h += '<option value="2"'+(d.prio==='2'?' selected':'')+'>&#x1F7E0; High</option>';
  h += '<option value="3"'+(!d.prio||d.prio==='3'?' selected':'')+'>&#x1F535; Normal</option>';

  h += '<span class="date-chip'+(d.due==='someday'?' sel':'')+'" data-d="someday" onclick="setDue(this,this.dataset.d)">Someday</span>';
  h += '<span class="date-chip" data-d="pick" onclick="setDue(this,this.dataset.d)">Pick date</span>';
  h += '</div><input type="date" id="inp-due" value="'+(d.due||'')+'" style="margin-top:6px"/></div>';
  h += '<div class="form-row"><label>&#x1F514; Remind at</label><input type="time" id="inp-rtime" value="'+(d.rt||'')+'" /></div>';
  h += '<div class="form-row"><label>Notes</label><textarea id="inp-notes" rows="2">'+esc(d.notes||'')+'</textarea></div>';
  h += '<button class="btn-primary" data-id="'+esc(d.id)+'" onclick="submitEditTask(this.dataset.id)">Save changes</button>';
  h += '<button class="btn-ghost" style="margin-top:8px;color:var(--red)" data-id="'+esc(d.id)+'" onclick="closeSheet();deleteTask(this.dataset.id)">Delete task</button>';

  openSheet();
}

async function submitEditTask(id) {
  var t = document.getElementById('inp-title').value.trim();
  if (!t) { showToast('Enter a title'); return; }
  var dp = document.getElementById('inp-due').value;
  var r = await apiPost('updateTask', {
    id: id, Title: t,
    Priority: document.getElementById('inp-prio').value,
    DueDate: dp || _due,
    Notes: document.getElementById('inp-notes').value,
    RemindTime: document.getElementById('inp-rtime') ? document.getElementById('inp-rtime').value : '',
    Status: 'Pending'
  });
  if (r&&r.ok) {
    closeSheet(); showToast('Updated!');
    // Update local state
    S.tasks = (S.tasks||[]).map(function(task) {
      if (task.ID===id) {
        task.Title=t; task.Priority=document.getElementById('inp-prio').value;
        task.DueDate=dp||_due; task.Notes=document.getElementById('inp-notes').value;
      }
      return task;
    });
    renderTasks();
    cacheInvalidate(['getTasks','getToday']);
  }
}

// ── CUSTOM CONFIRM (works on PWA + Android WebView) ──────────
function showConfirm(msg, onYes) {
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)';
  overlay.innerHTML = '<div class="confirm-dialog">' +
    '<div class="confirm-msg">' + msg + '</div>' +
    '<div style="display:flex;gap:10px">' +
    '<button id="conf-no" style="flex:1;padding:13px;border-radius:12px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-size:14px;font-weight:600">Cancel</button>' +
    '<button id="conf-yes" style="flex:1;padding:13px;border-radius:12px;background:var(--red);border:none;color:#fff;font-size:14px;font-weight:700">Delete</button>' +
    '</div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#conf-no').onclick = function() { document.body.removeChild(overlay); };
  overlay.querySelector('#conf-yes').onclick = function() { document.body.removeChild(overlay); onYes(); };
}

// ── DELETE FUNCTIONS (all use showConfirm) ───────────────────
async function deleteTask(id) {
  showConfirm('Delete this task?', async function() {
    S.tasks = (S.tasks||[]).filter(function(t){return t.ID!==id;});
    renderTasks();
    var r = await apiPost('deleteTask', {id:id});
    if (!r||!r.ok) { showToast('Delete failed'); loadTasks(); }
    else { showToast('Deleted'); cacheInvalidate(['getTasks','getToday','getStats']); }
  });
}

async function deleteFinRow(id) {
  showConfirm('Delete this transaction?', async function() {
    var el = document.getElementById('fr-'+id);
    if (el) el.style.opacity = '0.3';
    var r = await apiPost('deleteFinance', {id:id});
    if (r&&r.ok) {
      showToast('Deleted');
      cacheInvalidate(['getFinance','getStats','getToday']);
      setTimeout(loadFinance, 300);
    } else {
      showToast('Delete failed');
      if (el) el.style.opacity = '1';
    }
  });
}

// ── WORD OF DAY ACTIONS ───────────────────────────────────────
function dismissWOD(word, alreadyKnow) {
  // Hide WOD card for today
  localStorage.setItem('wod_dismissed', isoToday());
  if (alreadyKnow && word) {
    // Add to dictionary as "already known" — no review needed
    var dict = JSON.parse(localStorage.getItem('lifeos_dict')||'[]');
    if (!dict.find(function(w){return w.word===word;})) {
      dict.push({word:word, def:'(already known)', added:isoToday(), nextReview:'9999-12-31', known:true});
      localStorage.setItem('lifeos_dict', JSON.stringify(dict));
    }
    showToast('Marked as known — won\'t appear again');
  } else {
    showToast('Hidden for today');
  }
  // Remove WOD card from UI
  var card = document.querySelector('.wod-card-today');
  if (card) card.remove();
}

// Update loadWordOfDay to respect dismissal and "already known"
var _wodDismissed = localStorage.getItem('wod_dismissed') === isoToday();
var _wodKnownWords = (function() {
  try {
    var dict = JSON.parse(localStorage.getItem('lifeos_dict')||'[]');
    return dict.filter(function(w){return w.known;}).map(function(w){return w.word;});
  } catch(e) { return []; }
})();
